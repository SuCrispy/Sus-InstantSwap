plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven { url "https://api.modrinth.com/maven" }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven {
        name = 'Tencent Mirror'
        url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/client/resources/susinstantswap.accesswidener")
    mods {
        "susinstantswap" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // MC 26.1 is unobfuscated — no mappings needed
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "maven.modrinth:modmenu:${project.modmenu_version}"
}

processClientResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    archiveVersion = ''
    from("LICENSE") {
        rename { "${it}_Sus_InstantSwap" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) { from components.java }
    }
    repositories {}
}
