plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base { archivesName = 'Sus_InstantSwap-3.0.0-Forge1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'susinstantswap.mixins.json'
        ])
    }
    archiveVersion = ''
}

// ── Mixin AP: TSRG2 → SRG conversion for refmap generation ──
// ForgeGradle generates TSRG2, but Mixin AP 0.8.5 only reads standard SRG.
tasks.register('convertTsrgToSrg') {
    dependsOn 'createMcpToSrg'
    def tsrgFile = file("${buildDir}/createMcpToSrg/output.tsrg")
    def srgFile = file("${buildDir}/createMcpToSrg/output.srg")
    inputs.file(tsrgFile).optional()
    outputs.file(srgFile)
    doLast {
        String cls_l = null, cls_r = null
        srgFile.withWriter('UTF-8') { out ->
            tsrgFile.eachLine('UTF-8') { line ->
                if (line.startsWith('tsrg2 ')) return
                int tabs = 0
                for (int i = 0; i < line.length() && line.charAt(i) == '\t' as char; i++) tabs++
                String[] p = line.trim().split(' ')
                if (tabs == 0 && p.length >= 2) { cls_l = p[0]; cls_r = p[1]; out.println("CL: ${cls_l} ${cls_r}") }
                else if (tabs == 1 && p.length >= 3 && p[1].contains('(')) out.println("MD: ${cls_l}/${p[0]} ${p[1]} ${cls_r}/${p[2]} ${p[1]}")
                else if (tabs == 1 && p.length >= 2 && !p[0].startsWith('<')) out.println("FD: ${cls_l}/${p[0]} ${cls_r}/${p[1]}")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn 'convertTsrgToSrg'
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-AreobfSrgFile=' + file("${buildDir}/createMcpToSrg/output.srg"),
        '-AoutRefMapFile=' + file("${buildDir}/resources/main/susinstantswap.refmap.json")
    ]
}
