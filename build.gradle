plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = 'Sus_InstantSwap-3.0.0-Fabric26.1' }

repositories {
    maven { url "https://api.modrinth.com/maven" }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/client/resources/susinstantswap.accesswidener")
    mods {
        "susinstantswap" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "maven.modrinth:modmenu:${project.modmenu_version}"
}

// 26.1 uses Loom split sources (src/client); resources live under
// src/client/resources and are handled by processClientResources, not the
// (empty) processResources task. Apply the version expansion to ALL resource
// tasks so fabric.mod.json's ${version} is replaced regardless of source set.
tasks.withType(ProcessResources).configureEach {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    archiveVersion = ''
    from("LICENSE") {
        rename { "${it}_Sus_InstantSwap" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) { from components.java }
    }
    repositories {}
}
